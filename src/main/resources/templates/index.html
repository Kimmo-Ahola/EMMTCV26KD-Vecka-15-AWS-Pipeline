<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calculator Result</title>
</head>
<body>
<h1>Calculator</h1>
<p>
    The sum of
    <span id="a" th:text="${a}">0</span>
    and
    <span id="b" th:text="${b}">0</span>
    is
    <strong id="sum" th:text="${sum}">0</strong>.
</p>
</body>
</html>
